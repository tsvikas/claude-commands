name: Deploy the page to GitHub Pages

# A deploy replaces the whole site, so every deploy builds both copies:
# main at the root, and the staging branch under /staging/ while that branch exists.
on:
  push:
    branches: [main, staging]
  # a pull request builds the page, to catch a sheet line the generator cannot read, and deploys nothing
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the page
        run: python3 tools/page.py

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - name: Build the live page from main
        run: python3 main/tools/page.py
      - name: Look for a staging branch
        id: staging
        run: |
          if git -C main ls-remote --exit-code --heads origin staging > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.staging.outputs.found == 'true'
        with:
          ref: staging
          path: staging
      - name: Build the staging page under /staging/
        if: steps.staging.outputs.found == 'true'
        run: |
          python3 staging/tools/page.py --staging
          mkdir main/_site/staging
          cp -r staging/_site/. main/_site/staging/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: main/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
